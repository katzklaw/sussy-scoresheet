function renderTabs(){$('#tabs').innerHTML=[['p','Players & aliases'],...[...Array(N)].map((_,i)=>[String(i),'Game '+(i+1)])].map(([v,l])=>`<button class="${tab===v?'on':''}" onclick="tab='${v}';renderEditor()">${l}</button>`).join('')}
function renderEditor(){renderTabs();const e=$('#ed');
if(tab==='p'){const CD=compute();e.innerHTML=`<p class="hint">Paste each game's score block in its Game tab. In-game names are matched to players automatically where possible; anything unmatched (like friend codes) gets a dropdown, and your choice is remembered.</p><h3>SHEET NAMES &amp; COLORS</h3><div class="pl">${S.slots.map((s,i)=>`<div><select style="width:96px;font-weight:700;background:${s.color};color:${ink(s.color)}" onchange="S.slots[${i}].color=this.value;save();renderEditor();renderSheet()">${AU.map(([n,h])=>`<option value="${h}"${h===s.color?' selected':''} style="background:${h};color:${ink(h)}">${n}</option>`).join('')}</select><input value="${esc(s.name)}" oninput="S.slots[${i}].name=this.value;S.slots[${i}].manual=!!this.value.trim();save();renderSheet()">${CD[i].auto&&!(s.manual||/\//.test(s.name))?`<span class="an">auto label: ${esc(CD[i].auto)}</span>`:''}</div>`).join('')}</div><h3>REMEMBERED ALIASES</h3><div class="al" id="al"></div><p><button onclick="reset()">Reset everything</button></p>`;renderAl();return}
const gi=+tab,g=S.games[gi];
e.innerHTML=`<div><span>Game ${gi+1} result: </span>${[['crew','Crew win'],['imp','Imp win'],['','Unset']].map(([v,l])=>`<button class="rb ${v} ${g.res===v?'on':''}" onclick="setRes(${gi},'${v}')">${l}</button>`).join(' ')}</div><textarea placeholder="Paste the score block here…" oninput="paste(${gi},this.value)">${esc(g.raw)}</textarea><div id="rows"></div>`;renderRows()}
function renderAl(){const a=$('#al');if(!a)return;const q=k=>k.replace(/'/g,"\\'"),ks=Object.keys(S.map),hs=Object.keys(S.hosts),nm=v=>v==null?'?':esc(S.slots[v].name);
const ov=S.games.map((g,gi)=>Object.keys(g.map||{}).map(k=>`<span>${esc(k)} → ${nm(g.map[k])} (from game ${gi+1})<a onclick="delete S.games[${gi}].map['${q(k)}'];save();renderAl();renderSheet()">×</a></span>`).join('')).join('');
a.innerHTML=(ks.length||hs.length)?ks.map(k=>`<span>${esc(k)} → ${nm(S.map[k])}<a onclick="delete S.map['${q(k)}'];save();renderAl();renderSheet()">×</a></span>`).join('')+ov+hs.map(k=>`<span>${esc(k)} → host (excluded)<a onclick="delete S.hosts['${q(k)}'];save();renderAl();renderSheet()">×</a></span>`).join(''):'<span>None yet</span>'}
function setRes(gi,v){S.games[gi].res=v;save();renderEditor();renderSheet()}
function paste(gi,v){S.games[gi].raw=v;automap(gi);save();renderRows();renderSheet()}
function ed(gi,i,f,v){const g=S.games[gi],p=parse(g.raw)[i],o=g.rows[p.key]=g.rows[p.key]||{};
if(f=='slot'){const nv=v===''?null:+v;if(!(p.key in S.map)){if(nv!=null)S.map[p.key]=nv}else{g.map=g.map||{};if(nv===(prevEff(p.key,gi)??null))delete g.map[p.key];else g.map[p.key]=nv}}
else if(f=='alias'){S.alias=S.alias||{};S.alias[p.key]=v}
else if(f=='host'){const si=S.map[p.key],cn=x=>x.replace(/#\d+$/,'');if(v){S.hosts[p.key]=true;delete S.map[p.key];S.games.forEach(x=>{if(x.map)delete x.map[p.key]})}else delete S.hosts[p.key];automap(gi);if(v&&si!=null&&S.slots[si].name===cn(p.raw)){const q=parse(g.raw).find(x=>S.map[x.key]===si);if(q)S.slots[si].name=cn(q.raw)}}
else if(f=='sv'){o.sv=v===''?undefined:+v;delete o.score}
else if(f=='score')o.score=v===''?undefined:+v;
else if(f=='imp')o.imp=v;else if(f=='kills')o.kills=+v||0;else if(f=='adj')o.adj=+v||0;else if(f=='note')o.note=v;
else if(f=='q'){o.adj=(o.adj||0)+v[0];o.note=(o.note?o.note+' ':'')+v[1]}
save();renderRows();renderSheet()}
function renderRows(){const r=$('#rows');if(!r||tab==='p')return;const gi=+tab,g=S.games[gi],ps=parse(g.raw),cnt={};
const AL=p=>(S.alias||{})[p.key]??/#\d+$/.test(p.key),H=p=>!!S.hosts[p.key],np=ps.filter(p=>!H(p)).length;ps.forEach(p=>{const s=eff(p.key,gi);if(s!=null&&!H(p))cnt[s]=(cnt[s]||0)+1});
const ok=ps.every(p=>H(p)||eff(p.key,gi)!=null)&&Object.values(cnt).every(c=>c==1);
r.innerHTML=(ps.length?`<div class="st ${ok&&np==10?'ok':'bad'}">${np} players read${np<ps.length?' (host excluded)':''} · ${ok?(np==10?'all matched':'all matched (expected 10)'):'check highlighted rows'}${np>10?' · tick Host for the one who is not playing':''}</div>`:'')+`<div class="tw"><table class="rt"><tr><th>In-game name</th><th>Player</th><th>Score</th><th>SV</th><th>Imp</th><th>Kills</th><th>Adjust</th><th>Note</th><th title="Tick if this is the same player under another name or account">Alias</th><th>Host</th></tr>${ps.map((p,i)=>{const o=g.rows[p.key]||{},sv=o.sv??p.sv,sc=o.score??(p.total+sv-p.sv),s=eff(p.key,gi),dup=s!=null&&cnt[s]>1,f=(k,v)=>`onchange="ed(${gi},${i},'${k}',${v})"`;
return`<tr class="${H(p)?'hostrow':s==null||dup?'warn':''}"><td>${esc(p.raw)}</td><td><select ${f('slot','this.value')}><option value="">?</option>${S.slots.map((x,j)=>`<option value="${j}"${s===j?' selected':''}>${esc(x.name)}</option>`).join('')}</select></td><td><input type="number" value="${sc}" ${f('score','this.value')}></td><td><input type="number" value="${sv}" ${f('sv','this.value')}></td><td><input type="checkbox"${o.imp?' checked':''} ${f('imp','this.checked')}></td><td><input type="number" min="0" value="${o.kills||0}" ${f('kills','this.value')}></td><td><input type="number" value="${o.adj||0}" ${f('adj','this.value')}><span class="q"><button onclick="ed(${gi},${i},'q',[-1,'GA'])">−GA</button><button onclick="ed(${gi},${i},'q',[-1,'SV talk'])">−SV talk</button><button onclick="ed(${gi},${i},'q',[1,'solo imp'])">+solo</button></span></td><td><input value="${esc(o.note||'')}" ${f('note','this.value')}></td><td><input type="checkbox"${AL(p)?' checked':''} ${f('alias','this.checked')}></td><td><input type="checkbox"${H(p)?' checked':''} ${f('host','this.checked')}></td></tr>`}).join('')}</table></div>`}
function reset(){if(!confirm('Clear all games, players and aliases?'))return;S=fresh();save();prev={};tab='p';renderMeta();renderEditor();renderSheet()}
const GST=['#19abff','#ff80e8','#1ec73a'];
async function gimg(el){const cs=getComputedStyle(el),r=el.getBoundingClientRect(),K=2,pad=24,w=Math.ceil(r.width),h=Math.ceil(r.height);
try{await document.fonts.load(`${cs.fontWeight} ${cs.fontSize} Orbitron`)}catch(e){}
const c=document.createElement('canvas');c.width=(w+pad*2)*K;c.height=(h+pad*2)*K;const x=c.getContext('2d');x.scale(K,K);
const fs=parseFloat(cs.fontSize),ls=parseFloat(cs.letterSpacing)||0,pl=parseFloat(cs.paddingLeft)||0,txt=el.textContent.toUpperCase();
x.font=`${cs.fontWeight} ${fs}px ${cs.fontFamily}`;x.textBaseline='middle';
const g=x.createLinearGradient(pad+pl,0,pad+w,0);(el.tagName=='H1'?GST.slice().reverse():GST).forEach((col,i)=>g.addColorStop(i/(GST.length-1),col));
x.fillStyle=g;x.shadowColor='rgba(122,92,255,.55)';x.shadowBlur=14*K;
let px=pad+pl;for(const ch of txt){x.fillText(ch,px,pad+h/2);px+=x.measureText(ch).width+ls}
return{url:c.toDataURL('image/png'),w,h,pad}}
async function exp(){if(!window.html2canvas){alert('Image export library did not load.');return}
const sh=$('#sheet');let data=null;
try{data=await Promise.all([...sh.querySelectorAll('h1:not(.solid),.ft')].map(gimg))}catch(e){data=null;sh.classList.add('exporting')}
try{const c=await html2canvas(sh,{backgroundColor:'#07080f',scale:2,onclone:doc=>{if(!data)return;[...doc.querySelectorAll('#sheet h1:not(.solid),#sheet .ft')].forEach((el,i)=>{const d=data[i];if(!d)return;const im=doc.createElement('img');im.src=d.url;im.style.cssText=`display:block;max-width:none;width:${d.w+2*d.pad}px;height:${d.h+2*d.pad}px;margin:-${d.pad}px`;el.style.cssText+=';padding:0;background:none;color:transparent;filter:none;-webkit-background-clip:border-box;background-clip:border-box';el.textContent='';el.appendChild(im)})}});
const a=document.createElement('a');a.download=(ttl()||'scores').replace(/\W+/g,'-')+'.png';a.href=c.toDataURL('image/png');a.click()}finally{sh.classList.remove('exporting')}}
function msg(t){const m=$('#msg');if(m)m.textContent=t}
function renderTop(){$('#topbar').innerHTML=`<span class="dot ${CLOUD?(canEdit?'ed':'vw'):''}"></span><span>${CLOUD?(canEdit?'Live · you can edit':'Live · view only'):'Local mode · not shared'}</span><span class="sp"></span>${CLOUD?`<label>Sheet <input id="sid" value="${esc(SID)}" onkeydown="if(event.key=='Enter')openSheet()"></label><button onclick="openSheet()">Open</button>`:''}${CLOUD&&!canEdit?'<button class="ex" onclick="askCode()">Enter edit code</button>':''}<span id="msg"></span>`;document.body.classList.toggle('ro',CLOUD&&!canEdit)}
function openSheet(){const v=($('#sid').value||'').replace(/[^\w-]/g,'').slice(0,40)||'main';location.hash=v;location.reload()}
function askCode(){const c=prompt('Enter the edit code');if(!c)return;const u=firebase.auth().currentUser;if(!u){alert('Still connecting. Try again in a moment.');return}
DB.ref('editors/'+u.uid).set(c.trim()).then(()=>{canEdit=true;renderTop();renderMeta();renderEditor();save()}).catch(()=>alert('That code was not accepted.'))}
function rerender(){renderSheet();const a=document.activeElement,fin=el=>a&&el&&el.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(!fin($('#ed')))renderEditor();if(!fin($('#meta')))renderMeta()}
function applyRemote(v){let ch=false;
for(const k in v){if(!pieceKeys.includes(k)||typeof v[k]!=='string'||v[k]===last[k])continue;if(ready&&canEdit&&gen(k)!==last[k])continue;
try{const o=JSON.parse(v[k]);if(k==='cfg'){S.title=o.title||'';S.num=o.num||'';S.date=o.date||'';S.tcolor=o.tcolor||'';S.slots=o.slots||S.slots;S.map=o.map||{};S.hosts=o.hosts||{};S.alias=o.alias||{};snapColors()}else S.games[+k.slice(1)]=Object.assign({raw:'',res:'',rows:{}},o);last[k]=gen(k);ch=true}catch(e){}}
pieceKeys.forEach(k=>{if(last[k]===undefined)last[k]=gen(k)});
if(ch||!ready)rerender()}
function initCloud(){try{firebase.initializeApp(FB);DB=firebase.database()}catch(e){msg('Could not start Firebase: '+e.message);return}
firebase.auth().signInAnonymously().then(c=>DB.ref('editors/'+c.user.uid).once('value')).then(x=>{canEdit=x.exists();renderTop();renderMeta();renderEditor()}).catch(e=>msg('Sign-in problem: '+e.message));
DB.ref('sheets/'+SID).on('value',x=>{applyRemote(x.val()||{});ready=true},e=>msg('Could not read the sheet: '+e.message))}
renderTop();
renderMeta();renderEditor();renderSheet();
if(CLOUD)initCloud();
</script></body></html>
